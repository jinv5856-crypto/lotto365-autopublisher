.github/workflows/lotto-analysis.yml

name: Lotto365 Weekly Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '20 14 * * 6'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Check files
        run: |
          echo "Repository files:"
          ls -la
          echo "Python files:"
          find . -name "*.py" -maxdepth 3
